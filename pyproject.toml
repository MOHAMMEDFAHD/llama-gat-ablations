[project]
name = "llama-graph-attention"
version = "0.1.0"
description = "LLaMA reference decoder and LLaMA-inspired sparse graph attention with graph rotary encodings"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "torch_geometric>=2.5,<3", "numpy>=1.26", "scipy>=1.11", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
